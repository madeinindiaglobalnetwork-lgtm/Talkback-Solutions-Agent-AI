<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a1020" />
  <title>BharatChain — Sovereign Trade Network</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <style>
    html, body { margin: 0; padding: 0; background: #0a1020; min-height: 100%; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #cfe0f5; font-family: system-ui, sans-serif; text-align: center; padding: 20px; z-index: 9; }
    #boot .ring { width: 46px; height: 46px; border: 3px solid rgba(232,162,61,.25); border-top-color: #E8A23D; border-radius: 50%; animation: sp 1s linear infinite; margin-bottom: 16px; }
    @keyframes sp { to { transform: rotate(360deg); } }
    #boot b { color: #fff; letter-spacing: 1px; } #boot small { color: #7d93b5; margin-top: 8px; line-height: 1.5; }
    #err { display: none; position: fixed; inset: auto 12px 12px 12px; background: #2a1216; border: 1px solid #ff6a6a; color: #ffb4b4; font: 12px/1.5 monospace; padding: 10px 12px; border-radius: 10px; z-index: 99; word-break: break-all; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
      "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18.3.1",
      "three": "https://esm.sh/three@0.128.0",
      "d3": "https://esm.sh/d3@7"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body>
  <div id="boot">
    <div class="ring"></div>
    <b>BHARATCHAIN</b>
    <small>Sovereign Trade Network load ho raha hai…<br/>Pehli baar 10–20 sec lag sakte hain (phone pe compile hota hai).</small>
  </div>
  <div id="root"></div>
  <div id="err"></div>

  <script>
    window.addEventListener("error", function (e) {
      var d = document.getElementById("err");
      d.style.display = "block";
      d.textContent = "Load error: " + (e.message || e.type) + (e.filename ? " @ " + e.filename.split("/").pop() : "");
    }, true);
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }
  </script>

  <script type="text/babel" data-type="module" data-presets="react">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import App from "./MIIGNMobile.jsx";
    const boot = document.getElementById("boot");
    if (boot) boot.remove();
    createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
